services:
  api:
    build: .
    container_name: backend_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/hera_db
      JWT_SECRET: change_me
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: backend_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
